name: Controle & Docker-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regelverwerking, opslag en AdGuard API-koppeling
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript en installatiescripts
        run: |
          node --check app/static/app.js
          node --check app/static/hub.js
          node --check app/static/theme.js
          node --check app/static/account.js
          node --check app/static/filters.js
          node --check app/static/security.js
          node --check app/static/simple.js
          node --check app/static/workspace.js
          bash -n start.sh update.sh
      - name: Bouw productie-image
        run: docker build -t venguard:test .
      - name: Start productiecontainer met Compose
        run: |
          printf 'VENGUARD_PASSWORD=ci-only-disposable-test-password\n' > .env
          bash start.sh
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' venguard)" = healthy ]; then
              curl --fail http://127.0.0.1:8098/health
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Controleer productie-authenticatie
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base='http://127.0.0.1:8098'
          try:
              urllib.request.urlopen(base+'/api/state')
              raise SystemExit('Beheer-API stond open!')
          except urllib.error.HTTPError as e:
              assert e.code == 401, e.code
          session=json.load(urllib.request.urlopen(base+'/api/session'))
          assert session['authenticated'] is False
          PY
      - name: Test de gebundelde echte AdGuard Sync-engine
        run: |
          docker exec -i -e ADGUARD_SYNC_BINARY=/usr/local/bin/adguardhome-sync venguard python3 -c "import sys; __file__='/tmp/test_native_sync.py'; exec(compile(sys.stdin.read(), __file__, 'exec'))" < tests/test_native_sync.py
      - name: Start officiële Pi-hole v6 voor integratietest
        run: |
          docker run -d --name venguard-pihole-test --add-host=host.docker.internal:host-gateway -p 127.0.0.1:18080:80 -e FTLCONF_webserver_api_password=ci-only-pihole-password -e FTLCONF_dns_listeningMode=ALL pihole/pihole:2026.10.0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/api/info/login >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs venguard-pihole-test
          exit 1
      - name: Test echte Pi-hole sessies, Gravity en directe uitzonderingen
        env:
          VENGUARD_PIHOLE_DISPOSABLE: '1'
          VENGUARD_PIHOLE_URL: http://127.0.0.1:18080
          VENGUARD_PIHOLE_PASSWORD: ci-only-pihole-password
        run: python3 -m unittest discover -s tests -p test_native_pihole.py -v
      - name: Start twee schone officiële AdGuard Home-servers
        run: |
          docker run -d --name venguard-agh-one -p 127.0.0.1:19081:3000 adguard/adguardhome:v0.107.79
          docker run -d --name venguard-agh-two -p 127.0.0.1:19082:3000 adguard/adguardhome:v0.107.79
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:19081/control/install/get_addresses >/dev/null && curl --silent --fail http://127.0.0.1:19082/control/install/get_addresses >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test VenGuard-profiel op schone AdGuard met onbereikbare bron
        env:
          VENGUARD_AGH_DISPOSABLE: '1'
        run: python3 -m unittest discover -s tests -p test_native_adguard.py -v
      - name: Controleer scanneragent en lokale Nmap-uitvoering
        run: |
          docker exec venguard-scanner nmap -sn -n -oX - 127.0.0.1
          docker exec -i venguard python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          token=json.loads(Path('/network/agent-token').read_text())['token']
          assert token
          for attempt in range(30):
              info=json.loads(Path('/data/network.json').read_text()) if Path('/data/network.json').exists() else {}
              if time.time()-info.get('agent_seen',0)<180:break
              time.sleep(1)
          else:raise SystemExit('Scanneragent meldt zich niet bij VenGuard')
          PY
      - name: Opruimen
        if: always()
        run: |
          docker compose down || true
          docker rm -f venguard-pihole-test venguard-agh-one venguard-agh-two || true
